<!--  Favicon follows the *browser* theme, not the app's toggle: the tab strip
      is browser chrome, so it tracks prefers-color-scheme. Black mark on a
      light tab strip, white mark on a dark one. Order matters — the media
      query variant must come first for browsers that honour it, and the
      plain one is the fallback for those that don't (Safari).           -->
<link rel="icon" type="image/png" href="logo/favicon%20white.png" media="(prefers-color-scheme: dark)">
