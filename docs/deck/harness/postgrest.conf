# PostgREST against the LOCAL throwaway pgbox. Nothing here can reach a remote host.
db-uri = "postgres://postgres:postgres@127.0.0.1:54350/postgres"
db-schemas = "public"

# Clerk signs session tokens RS256 against its own JWKS, and the app's
# createServerSupabase() rides that token straight through. PostgREST verifies it
# with the same key set the real Supabase third-party-auth integration uses.
jwt-secret = "@/tmp/claude-1000/-home-divas-Documents-GitHub-sahodalabs/bba3e938-0904-498b-b8eb-82ebf7aa416b/scratchpad/clerk-jwks.json"

# Whether or not Clerk stamps `role: authenticated` on this dev instance, a verified
# token lands on the `authenticated` role — which is the role every RLS policy in
# packages/db is written `to`. `request.jwt.claims` is populated from the verified
# token either way, so `app.member_workspace_ids()` reads the real `sub`.
db-anon-role = "authenticated"

server-host = "127.0.0.1"
server-port = 3222
db-pool = 4
