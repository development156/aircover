# Run the gate on every pull request, so a lane cannot merge on a check nobody ran.
#
# ── WHY THIS EXISTS ──────────────────────────────────────────────────────────
# REQUESTS §15: no CI workflow ran the gate. The five workflows already here are
# nightly jobs and a post-deploy probe, so until now every typecheck, lint and
# unit test this project has ever run has run on a developer's laptop, at a time
# of that developer's choosing, on the branch they happened to be standing on.
# Three lanes move independently and merge into `wt-core`; "I ran the gate" was
# an assertion nobody could check.
#
# ── WHAT IT RUNS, AND WHAT IT DELIBERATELY DOES NOT ──────────────────────────
# `pnpm gate` is five stages (scripts/gate.mjs). This runs three of them and
# names the two it skips, because a CI file that silently covers less than its
# name suggests is the same defect as a stale number on a screen.
#
#   1  turbo typecheck + lint + test   RUNS
#   2  vitest (root)                   RUNS
#   3  turbo test:smoke  (Playwright)  SKIPPED — see below, and the dispatch job
#   4  prettier --check .              RUNS
#   5  turbo build                     SKIPPED — Vercel already builds every PR
#
# **Stage 3 is skipped because it WRITES TO PRODUCTION.** There is exactly one
# Supabase project in this account and it is `rloztdhzfliyvpvxsgjl`. Every
# `@smoke` spec mints a Clerk user, signs it in, and lets the app create a
# workspace and a credit ledger. Running that on every pull request would not
# check the product — it would put test workspaces into the customer database
# automatically, which is the accident `src/lib/testing/e2e-target.ts` exists to
# stop. `post-deploy-smoke.yml` reached the same conclusion first and this file
# does not overturn it. The suite stays a deliberate act, and the `smoke` job
# below is how you perform it on a runner instead of a laptop.
#
# **Stage 5 is skipped because Vercel already runs it**, including
# `scripts/perf/js-budget.mjs`, on every push to a branch with an open pull
# request. Duplicating it here would need a dozen build-time secrets in GitHub to
# tell us something a green Vercel check already tells us.
#
# ── WHAT A GREEN TICK HERE EARNS, STATED PLAINLY ─────────────────────────────
# The code typechecks, passes lint including the design lint, passes every unit
# and PGlite suite, and is formatted. It says NOTHING about whether the app
# builds (read the Vercel check) or whether a signed-in customer can complete a
# journey (run the `smoke` job, or `pnpm gate` locally).

name: gate

on:
  # EVERY branch, not only the integration ones, and this is the important line.
  #
  # MEASURED 2026-08-26: this workflow fired on two pushes to an open pull
  # request (runs 1 and 2) and then did NOT fire on the next two — `eb227bb` and
  # `2a5c9d4` both landed, both deployed on Vercel, and neither produced a run.
  # The workflow was valid and `state: active` throughout, other workflows ran in
  # the same minutes, and a manual dispatch of this one succeeded immediately
  # (run 3, green). So the `pull_request` synchronize event is not something to
  # depend on here; the cause is still unknown and is recorded in REQUESTS §27.
  #
  # A push to a branch is the event that certainly happened, because the commit
  # is on the remote. Keying off it means coverage does not rest on GitHub
  # deciding to tell us about a pull request.
  push:
  # Kept as well, for anything that arrives as a pull request without a push to
  # this repository. The concurrency group below collapses the pair so one
  # commit still costs one run.
  pull_request:
  workflow_dispatch:
    inputs:
      ack_target:
        description: >-
          To also run the Playwright @smoke suite, type the Supabase project ref
          it will write to. Leave EMPTY to run the checks only. A boolean would
          be satisfiable by anyone who wanted the error to go away; a ref cannot
          be typed without naming the database you are about to write into.
        required: false
        default: ''

# Keyed on the BRANCH, and the first version of this line got it wrong in a way
# worth recording. It keyed on the head COMMIT, reasoning that `push` and
# `pull_request` firing for the same commit should collapse into one run. They
# do — and superseded pushes to the same branch then each run to completion,
# because two commits are two groups. MEASURED immediately: amending a commit
# left run 4 grinding through twelve minutes for a SHA that no longer existed on
# the branch, which is exactly the waste the comment claimed to prevent.
#
# The branch is the right key, and getting the EXPRESSION right took two tries
# after getting the concept right. `github.head_ref || github.ref` looks correct
# and is not: on a push `github.ref` is `refs/heads/<branch>` while on a pull
# request `github.head_ref` is the bare `<branch>`. Two different strings, two
# groups, nothing collapses.
#
# MEASURED 2026-08-26, on the merge that brought three lanes together: SEVEN
# gate runs in flight at once, of which three were push/pull_request PAIRS for
# the same branch at the same SHA — lead-research, advisor and design each
# running the same eleven minutes twice.
#
# `github.ref_name` is the bare branch name, which is what `head_ref` already
# is. On a pull request `ref_name` would be `<n>/merge`, but `head_ref` is
# non-empty there and wins, so the pair resolves to one string from both events.
concurrency:
  group: gate-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck · lint · test · format
    runs-on: ubuntu-latest
    # MEASURED on this workflow's own first run (run 2, commit 3394d38, a cold
    # cache): 11m31s end to end — 18s to install, 10m15s for turbo, 5s for root
    # vitest, 27s for prettier. Not the six minutes the same three stages take on
    # the development container: a hosted runner has fewer cores than that
    # machine, and `--concurrency=1` gives turbo no way to use more anyway.
    # Twenty leaves room for a slower runner and is short enough that a hung job
    # is noticed the same morning.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ── THE THREE STAGES, EACH AS ITS OWN STEP ─────────────────────────────
      # Not one `pnpm gate --only=…` call, because a failed step name is the
      # first thing a person reads on a red pull request, and "gate" tells them
      # nothing about which half of it broke.
      #
      # `--concurrency=1` for the same reason `scripts/gate.mjs` uses it: the
      # PGlite integration suites boot a real Postgres per file and time out at
      # 60 seconds under a parallel fan-out (REQUESTS §23). A hosted runner has
      # fewer cores than the development machine, not more, so the risk is
      # higher here rather than lower — and a PGlite timeout reports its tests as
      # SKIPPED, which is the shape that reads as green.
      - name: Typecheck, lint and test
        run: pnpm turbo run typecheck lint test --concurrency=1

      - name: Root vitest
        run: pnpm exec vitest run

      - name: Formatting
        run: pnpm exec prettier --check .

      # A suite that ran nothing reports as passing, which is how twenty-six
      # billing tests never executed for months. This makes the skip count
      # visible on every run so a number that climbs is something somebody sees
      # rather than something somebody could have looked up.
      - name: Report what was skipped
        if: always()
        run: |
          echo "### Gate coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran: turbo typecheck + lint + test, root vitest, prettier." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Not run here, by design:**" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`turbo test:smoke\` (Playwright) — it writes to the one production database. Run the \`smoke\` job on this workflow deliberately, or \`pnpm gate\` locally." >> "$GITHUB_STEP_SUMMARY"
          echo "- \`turbo build\` — Vercel builds every pull request, including the JS budget." >> "$GITHUB_STEP_SUMMARY"

  # ── THE SMOKE LEG, ON PURPOSE AND NEVER BY ACCIDENT ────────────────────────
  # This is the job that makes a cloud session's missing leg runnable at all:
  # Playwright's bundled Chromium cannot complete an outbound HTTPS request in a
  # claude.ai/code sandbox (REQUESTS §25), so an agent cannot run the smoke suite
  # even when it should. A hosted runner has ordinary network.
  #
  # It is `workflow_dispatch` only, and it requires the operator to TYPE the
  # project ref they are about to write to. That is `SAHODA_E2E_ACK_TARGET`'s own
  # design — a boolean would be satisfiable by anyone who wanted the error to go
  # away, and a ref cannot be typed without naming the destination. The input is
  # not defaulted, so nobody can run this by clicking through.
  smoke:
    name: Playwright @smoke (writes to the named database)
    if: github.event_name == 'workflow_dispatch' && inputs.ack_target != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Refuses before installing a browser or starting a server, so a run with
      # nothing configured costs seconds and says exactly what is missing rather
      # than dying inside `global-setup.ts` with a stack trace.
      # ── IT SAYS WHICH TAB, BECAUSE "ADD THEM" WAS NOT ENOUGH ────────────────
      # MEASURED twice, 2026-08-29 run 981 and 2026-08-30 run 1061: the founder
      # added all three and the job still refused with the identical message,
      # naming the identical three. "Repository secrets are not configured" is
      # true and useless, because the page it points at has THREE tabs that all
      # store a name and a value:
      #
      #   Secrets   → Repository secrets   `secrets.X`   what this job reads
      #   Secrets   → Dependabot           invisible to Actions entirely
      #   Variables → Repository variables `vars.X`      a different namespace
      #
      # and Settings → Environments is a fourth place, invisible unless the job
      # declares `environment:`, which this one deliberately does not.
      #
      # So the guard now LOOKS in the other places before it complains. It
      # prints only whether each name is set, never a value: `vars` are not
      # masked in logs, so echoing one would publish it.
      - name: Refuse without the keys the suite needs
        # ── ALL SIX, BECAUSE THREE WAS THE SAME DEFECT ONE LAYER DOWN ──────────
        # This step checked THREE names while the run step below forwards SIX.
        # `scripts/cloud-setup.sh`'s ENV_REQUIRED names two of the missing three
        # as needed for the app to boot at all. So somebody who added exactly the
        # three this guard asked for CLEARED IT and then died inside the suite
        # with the opaque failure the guard exists to prevent -- a guard that
        # certifies a configuration it never checked, which is worse than no
        # guard, because it tells you the environment is ready.
        #
        # The six are the six `test:smoke` declares in turbo.json. Turborepo 2.x
        # defaults to `envMode: "strict"` and strips anything undeclared, so a
        # name checked here but not declared there would be checked and then
        # thrown away. `SUPABASE_JWT_SECRET` is deliberately NOT among them: it
        # is in ENV_REQUIRED because that script provisions `packages/db`'s live
        # proofs, and nothing apps/web runs in this job reads it.
        #
        # `scripts/lib/ci-gate-coverage.test.mjs` now asserts that this list, the
        # run step's list and turbo.json's list are the same set, so the drift
        # that caused this cannot come back quietly.
        #
        # ── IT SAYS WHICH TAB, BECAUSE "ADD THEM" WAS NOT ENOUGH ───────────────
        # MEASURED twice, 2026-08-29 run 981 and 2026-08-30 run 1061: the founder
        # added all three and the job still refused with the identical message,
        # naming the identical three. "Repository secrets are not configured" is
        # true and useless, because the page it points at has THREE tabs that all
        # store a name and a value:
        #
        #   Secrets   -> Repository secrets   `secrets.X`   what this job reads
        #   Secrets   -> Dependabot           invisible to Actions entirely
        #   Variables -> Repository variables `vars.X`      a different namespace
        #
        # and Settings -> Environments is a fourth place, invisible unless the
        # job declares `environment:`, which this one deliberately does not.
        #
        # So the guard LOOKS in the other places before it complains. It prints
        # only whether each name is set, never a value: `vars` are not masked in
        # logs, so echoing one would publish it.
        env:
          SECRET_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          SECRET_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # ── THE FOUR SUPABASE VALUES COME FROM E2E_-PREFIXED SECRETS ───────────
          # MEASURED 2026-09-05, run 33961015055: the founder added all six
          # secrets, this guard passed for the first time ever, and the suite
          # refused in 9 seconds with `decision refused-production`. The six
          # unprefixed names ARE production: metrics-nightly, radar-nightly and
          # audience-nightly read the same `secrets.SUPABASE_DB_URL` to write
          # real customers' metrics. `e2e-target.ts` refuses production outright
          # and names staging (`yoxmzwkxweasfaahhvpj`) as the only target. So
          # this job reads its own four, forwards them under the names the app
          # expects, and the nightly jobs keep theirs. The Clerk pair is shared
          # on purpose: there is one development instance and the suite mints
          # `+clerk_test` users on it.
          SECRET_NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SECRET_NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SECRET_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          SECRET_SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
          VAR_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          VAR_CLERK_SECRET_KEY: ${{ vars.CLERK_SECRET_KEY }}
          VAR_NEXT_PUBLIC_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
          VAR_NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.E2E_SUPABASE_ANON_KEY }}
          VAR_SUPABASE_SERVICE_ROLE_KEY: ${{ vars.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          VAR_SUPABASE_DB_URL: ${{ vars.E2E_SUPABASE_DB_URL }}
        run: |
          # One list, walked twice, so the "is it missing" half and the "is it in
          # the wrong tab" half cannot disagree the way the old six hand-written
          # lines could.
          # Each line is ENV_NAME=SECRET_NAME: the name the app reads, and the
          # repository secret it is read FROM. They differ for the four Supabase
          # values (see the env block above), and the message below names the
          # SECRET, because that is the name a person has to type into Settings.
          NEEDED="NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
          CLERK_SECRET_KEY=CLERK_SECRET_KEY
          NEXT_PUBLIC_SUPABASE_URL=E2E_SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=E2E_SUPABASE_ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=E2E_SUPABASE_SERVICE_ROLE_KEY
          SUPABASE_DB_URL=E2E_SUPABASE_DB_URL"

          missing=""
          found_as_vars=""
          for pair in $NEEDED; do
            name="${pair%%=*}"
            secret="${pair##*=}"
            secret_ref="SECRET_$name"
            var_ref="VAR_$name"
            if [ -z "${!secret_ref}" ]; then
              missing="$missing $secret"
              # Presence only, never the value.
              if [ -n "${!var_ref}" ]; then
                found_as_vars="$found_as_vars $secret"
              fi
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Not readable as repository secrets:$missing"
            if [ -n "$found_as_vars" ]; then
              echo "::error::FOUND UNDER THE VARIABLES TAB INSTEAD:$found_as_vars"
              echo "A variable is a different namespace from a secret, is not masked in logs,"
              echo "and this job reads secrets. Delete them from Variables and re-add them under"
              echo "Settings -> Secrets and variables -> Actions -> Secrets -> Repository secrets."
            else
              echo "Add them under Settings -> Secrets and variables -> Actions, on the SECRETS tab,"
              echo "as REPOSITORY secrets. Three other places store a name and a value and none of"
              echo "them reaches this job: the Variables tab, the Dependabot tab, and"
              echo "Settings -> Environments (this job declares no environment, by design)."
            fi
            echo "All six are needed: the suite signs in through Clerk and the app it drives"
            echo "reads Supabase with the anon key, the service role key and the pooler URL."
            echo "The four E2E_SUPABASE_* values belong to STAGING (yoxmzwkxweasfaahhvpj):"
            echo "the suite refuses production, and the unprefixed names are production."
            exit 1
          fi

      - name: Install Chromium
        run: pnpm --filter @sahoda/web exec playwright install --with-deps chromium

      - name: Run the smoke suite
        env:
          # The acknowledgement, typed by a person at dispatch time. Declared on
          # the `test:smoke` task in turbo.json — Turborepo 2.x defaults to
          # `envMode: "strict"` and strips anything undeclared, so an
          # acknowledged run without that line would be refused anyway.
          SAHODA_E2E_ACK_TARGET: ${{ inputs.ack_target }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          # Staging, under the names the app reads. See the guard step above.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.E2E_SUPABASE_DB_URL }}
        run: pnpm turbo run test:smoke --concurrency=1

      # The traces are the only thing worth having from a failed browser run, and
      # they are the first thing lost when a runner is torn down.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
