# Probe a deployment AFTER it goes live, and fail loudly.
#
# WHY THIS IS THE FIRST WORKFLOW IN THIS REPO. There is no CI here. `.github`
# contained one issue template and nothing else, so every check this project has
# ever run has run on a developer's laptop, at a time of that developer's
# choosing. Run 27 found a production BUILD error that the local gate could not
# reach for 27 runs; a deployment that builds and then serves a broken site is
# the same blindness one layer further out.
#
# WHAT IT ACTUALLY CHECKS, stated plainly so nobody reads more into a green tick
# than it earns: the six routes in `scripts/lib/probe-routes.mjs`, signed out.
# It proves the deployment is up, that protected routes send you to sign-in and
# keep your destination, that /sign-in renders, and that /admin 404s rather than
# advertising itself. It does NOT sign in, publish, spend a credit, or touch the
# database.
#
# The full `@smoke` Playwright suite (99 tests in 30 files, MEASURED 2026-08-22)
# is deliberately NOT run here, and the reason is now stronger than the original
# one. That suite does not read; it CREATES. Every spec mints a Clerk user, signs
# it in, and lets the app create a workspace, a credit ledger and whatever rows it
# exercises. There is exactly one Supabase project in this account and it is
# production. Running it on every deploy would not check production — it would
# write test workspaces into the customer database automatically, which is the
# accident `src/lib/testing/e2e-target.ts` exists to stop. It stays a deliberate
# act behind SAHODA_E2E_ACK_TARGET.
#
# ── THIS WORKFLOW HAS NEVER PASSED, AND THAT IS THE OTHER HALF ────────────────
# MEASURED via the Actions API 2026-08-22: 16 runs, 6 completed as `failure`, 10
# `skipped`, ZERO successes — on 19, 20 and 22 August, from wt-loose-ends, wt-loop
# and wt-handoff. Every failure was the same thing: `deployment_status` fires for
# PREVIEW deployments too, a protected preview redirects to
# `vercel.com/sso-api` and lands on `vercel.com/login`, so all six routes
# "landed on /login" and the run reported `0/6 routes behave`.
#
# The app was fine every time. The probe was measuring Vercel's login page.
#
# Two changes close it. The job now runs only for PRODUCTION deployments, and
# `scripts/lib/probe-routes.mjs` detects the wall by host and exits 2 for "could
# not measure" rather than 1 for "production is down" — because an alarm that
# cries wolf is one people mute, which this file's own header said from the start.

name: post-deploy smoke

on:
  # Vercel's GitHub integration posts a deployment status when a build finishes,
  # so this fires on the real event rather than on a timer that hopes.
  deployment_status:
  # And by hand, against any URL — the path a human uses to check a rollback.
  workflow_dispatch:
    inputs:
      url:
        description: Deployment URL to probe
        required: true
        default: https://sahodalabs.vercel.app

permissions:
  contents: read

jobs:
  probe:
    # `deployment_status` fires for every state including `pending` and `error`.
    # Probing a deployment that has not finished would fail for the one reason
    # that is not a defect, so the success state is the only one worth a run.
    # `deployment_status` fires for every state including `pending` and `error`,
    # and for every ENVIRONMENT including Preview. Probing a preview is what made
    # every previous run of this workflow red: previews sit behind Vercel
    # deployment protection, so the probe measured a login page. Production only.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No install step, and that is deliberate: the probe is plain Node with no
      # imports outside `scripts/`. A `pnpm install` here would make a check that
      # exists to be fast and boring depend on the whole dependency graph.
      - name: Probe the routes
        env:
          PROBE_HOST: ${{ github.event.inputs.url || github.event.deployment_status.target_url }}
        run: |
          if [ -z "$PROBE_HOST" ]; then
            echo "No deployment URL to probe — refusing to pass by default."
            exit 1
          fi
          echo "Probing $PROBE_HOST"
          set +e
          node scripts/probe-production.mjs "$PROBE_HOST"
          code=$?
          set -e
          # Exit 2 is "could not measure", and on a PRODUCTION deployment that is
          # itself a misconfiguration worth failing on — production must not sit
          # behind deployment protection. It is reported with its own sentence so
          # nobody spends an afternoon debugging an app that was never asked.
          if [ "$code" = "2" ]; then
            echo "::error::Could not measure $PROBE_HOST — it answered with Vercel deployment protection, not the app."
            exit 1
          fi
          exit $code

      # ── THE HALF NO ROUTE PROBE CAN SEE ──────────────────────────────────────
      # A cron path lives in three places that cannot see each other: the schedule
      # in vercel.json, the Clerk exemption in middleware.ts, and the route file.
      # `lib/cron/wiring.test.ts` requires all three to agree IN THE REPOSITORY and
      # can say nothing about the DEPLOYMENT — the deployed branch is not the branch
      # anyone is standing on. MEASURED 2026-08-22 against the production alias:
      # 1 of 3 scheduled crons is reachable. The other two answer a Clerk redirect
      # that Vercel cron does not follow, so their ticks have always done nothing
      # while the dashboard showed jobs that run.
      #
      # No cron secret is sent, so this can never trigger a job. A reachable route
      # answers 401 and that 401 IS the pass.
      - name: Probe cron reachability
        env:
          PROBE_HOST: ${{ github.event.inputs.url || github.event.deployment_status.target_url }}
        run: node scripts/probe-crons.mjs "$PROBE_HOST"
