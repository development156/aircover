# The independent status page.
#
# ── WHY IT IS HERE AND NOT IN THE APP ────────────────────────────────────────
# A status page served by the thing it reports on cannot answer during the one
# event it exists for. This one is built by GitHub Actions and served by GitHub
# Pages — a different company, a different network, a different failure domain
# from Vercel, Supabase and Upstash. If all three are down, this page still loads
# and still says so.
#
# ── ARMED 2026-08-23, AND OFF UNTIL PAGES IS ENABLED ─────────────────────────
# GitHub fires `schedule` only from a repository's DEFAULT branch, which on
# `origin` (development156/sahodalabs) is `wt-web`, where `.github/workflows` does
# not exist at all. MEASURED 2026-08-23: that repo also has ZERO Actions secrets,
# so the scheduled jobs are armed on IDIVASM/sahodalabs instead, whose default
# branch is `main` and which holds the credentials. `arm-workflows.mjs` does it.
#
# That is the same split this lane found in the crons: the schedule lives in one
# place and the thing it starts lives in another, and watching only the half that
# fired reports green forever.
#
# ── AND THE PAGES SETTING ────────────────────────────────────────────────────
# `actions/deploy-pages` needs Pages enabled for the repository with the source
# set to "GitHub Actions". Without it this job fails at the deploy step with a
# permissions error, which is the correct direction: loud, not silently absent.
name: status page

on:
  schedule:
    # Every 30 minutes. `STALE_AFTER_MINUTES` in scripts/lib/status-page.mjs is 60,
    # so a single missed run still reads as current and two in a row do not — a
    # scheduled trigger is best-effort and is regularly 10-30 minutes late.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or SHA carrying the prober (blank = the SAHODA_JOBS_REF variable)'
        required: false
        type: string
      url:
        description: Host to probe
        required: false
        default: https://app.sahodalabs.com

permissions:
  contents: read
  pages: write
  id-token: write

# Never two builds at once: the second would publish whichever finished last,
# which is not necessarily the newest measurement.
concurrency:
  group: status-page
  cancel-in-progress: true

jobs:
  build:
    # ⚠ ARMED BUT OFF, UNTIL PAGES IS ENABLED. ⚠
    #
    # MEASURED 2026-08-23: `GET /repos/IDIVASM/sahodalabs/pages` answers 404 — Pages
    # is not enabled for this repository. `actions/deploy-pages` cannot succeed
    # without it, and this job runs every 30 minutes, so arming it as-is would post
    # 48 identical failures a day. A notification everyone learns to ignore is worse
    # than a page nobody has switched on yet.
    #
    # Enabling Pages is not a change a script should make on someone's behalf: this
    # repository is PRIVATE, and turning Pages on decides who can read a page about
    # the health of a production system. That is the founder's call.
    #
    # TO TURN IT ON: enable Pages with the source set to "GitHub Actions", then set
    # the repository variable STATUS_PAGE to the literal `on`. A manual dispatch is
    # ungated, so the job can be tested before the schedule is trusted.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || vars.STATUS_PAGE == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # ⚠ THE REF IS NOT OPTIONAL HERE. ⚠
      # A bare checkout takes the branch the workflow FIRED from, and a scheduled
      # run always fires from the default branch. The default branch is a carrier
      # for the schedule and does not hold the application — MEASURED 2026-08-23:
      # `scripts/build-status-page.mjs` does not exist on it. A bare checkout
      # therefore fails at the build step with "cannot find module", on a page
      # whose entire purpose is to answer when other things cannot.
      - name: Check out the prober
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || vars.SAHODA_JOBS_REF || 'wt-integrate3' }}
          fetch-depth: 1

      # Same sentence as the three nightly collectors: a finished run must say
      # which commit produced it, in the summary rather than buried in a log.
      - name: Say which code this run executes
        run: |
          {
            echo '### Code under this run'
            echo
            echo '| | |'
            echo '|---|---|'
            printf '| asked for | `%s` |\n'   "$REQUESTED"
            printf '| resolved to | `%s` |\n' "$(git rev-parse HEAD)"
            printf '| subject | %s |\n'       "$(git log -1 --pretty=format:%s)"
            printf '| committed | %s |\n'     "$(git log -1 --pretty=format:%cI)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          REQUESTED: ${{ inputs.ref || vars.SAHODA_JOBS_REF || 'wt-integrate3' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No install step. The probes are plain Node with no imports outside
      # scripts/, deliberately: a page that exists to be up must not depend on the
      # dependency graph being installable.
      - name: Build the page
        env:
          PROBE_HOST: ${{ github.event.inputs.url || 'https://app.sahodalabs.com' }}
        # Always exits 0 — the page reports the failure rather than the job hiding
        # it. A status page that only publishes when everything is fine is a page
        # that goes blank exactly when it matters.
        run: node scripts/build-status-page.mjs "$PROBE_HOST" public/status/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/status
      - id: deploy
        uses: actions/deploy-pages@v4
